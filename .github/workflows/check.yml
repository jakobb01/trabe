name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check stock_agent scripts tests
      - run: ruff format --check stock_agent scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -p 'integration_*.py' -v
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh deploy/*.sh; do
            bash -n "$script"
          done
          sh -n deploy/stock-agent-quadlet-generator
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: bash scripts/check-container.sh
