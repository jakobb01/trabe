[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpulse-agent"
version = "0.2.1"
description = "Telegram-controlled stock watcher for a Raspberry Pi"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[project.scripts]
stock-agent = "stock_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["stock_agent*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
