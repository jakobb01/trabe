[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trabe"
version = "0.8.11"
description = "Telegram-controlled stock watcher for a Raspberry Pi"
requires-python = ">=3.11"
dependencies = ["websocket-client==1.9.2"]

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[project.scripts]
trabe = "trabe.__main__:main"

[tool.setuptools.packages.find]
include = ["trabe*"]

[tool.setuptools.package-data]
trabe = ["data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
